name: Node CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:legacy
      - run: npm run test:exports
      - run: npm run test:package
      - name: Prepare compatibility package
        run: |
          mkdir compatibility-package
          npm pack --pack-destination compatibility-package
          cp test/package-exports.cjs compatibility-package/
      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-package
          path: compatibility-package
          retention-days: 1
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Node ${{ matrix.node-version }} package
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 14.18.0
          - 16.x
          - 18.x
          - 20.x
          - 22.x
          - 24.x
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-package
          path: compatibility-package
      - run: npm init --yes
        working-directory: compatibility-package
      - name: Install packed package without development dependencies
        working-directory: compatibility-package
        run: npm install --ignore-scripts --no-package-lock ./ssh-config-*.tgz
      - name: Test CommonJS and ESM exports
        working-directory: compatibility-package
        run: node package-exports.cjs
