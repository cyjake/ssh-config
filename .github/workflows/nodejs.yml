name: Node CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm install
      - run: npm run lint
      - run: npm run test:package

  compatibility:
    name: Node ${{ matrix.node-version }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 14.x
            suite: legacy
          - node-version: 16.x
            suite: legacy
          - node-version: 18.x
            suite: legacy
          - node-version: 20.x
            suite: legacy
          - node-version: 22.x
            suite: modern
          - node-version: 24.x
            suite: modern
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
      - name: Run legacy suite
        if: matrix.suite == 'legacy'
        run: npm run test:legacy:coverage
      - name: Run modern suite
        if: matrix.suite == 'modern'
        run: npm run test:coverage
      - name: Test CommonJS and ESM exports
        run: npm run test:exports
      - name: Upload coverage
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
